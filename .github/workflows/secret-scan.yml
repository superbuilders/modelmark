name: Secret scan

on:
    pull_request:

concurrency:
    group: secret-scan-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    pr-gate:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            GITLEAKS_VERSION: 8.30.1
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install gitleaks (pinned, checksummed)
              run: |
                  set -eo pipefail
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
                  grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo mv gitleaks /usr/local/bin/

            - name: Scan the PR's commits
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  git rev-parse -q --verify "${BASE_SHA}^{commit}" >/dev/null
                  git rev-parse -q --verify "${HEAD_SHA}^{commit}" >/dev/null
                  gitleaks git . \
                      --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" \
                      --config .gitleaks.toml \
                      --redact \
                      --report-format json \
                      --report-path gitleaks-report.json \
                      --exit-code 0 \
                      --no-banner

            - name: Report findings and fail on any
              run: python3 .github/scripts/gitleaks-pr-summary.py gitleaks-report.json >> "$GITHUB_STEP_SUMMARY"
